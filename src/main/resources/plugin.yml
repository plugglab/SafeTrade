name: SafeTrade
version: ${project.version}
main: com.safetrade.SafeTradePlugin
api-version: "1.21"
author: PluggLab Studio
description: Safe player-to-player trading plugin
website: https://plugglab.github.io

commands:
  trade:
    description: Send a trade request
    usage: /trade <player>
    aliases: [handel, wymiana]
  tradeaccept:
    description: Accept a trade request
    usage: /tradeaccept [player]
    aliases: [tak]
  tradedeny:
    description: Deny a trade request
    usage: /tradedeny [player]
    aliases: [odrzuc]
  tradecancel:
    description: Cancel an active trade or deny a pending request
    usage: /tradecancel
    aliases: [nie, anuluj]
  tradeadmin:
    description: Open the SafeTrade admin history and rollback panel
    usage: /tradeadmin [rollback <id>]
    aliases: [stadmin]

permissions:
  safetrade.use:
    description: Allows trade commands
    default: true
  safetrade.admin:
    description: Allows trade rollback and admin panel access
    default: op
