settings:
  request-cooldown-seconds: 3
  request-expire-seconds: 30
  trade-start-cooldown-seconds: 10
  trade-complete-delay-seconds: 5
  safety-hold-seconds: 120
  discord-webhook-url: ""
  enable-money-trades: true
  max-money-per-player: 0
  require-same-world: true
  max-trade-distance: 10
  blocked-worlds: []
  blocked-gamemodes:
    - CREATIVE
    - SPECTATOR
  blocked-materials:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK
    - CHAIN_COMMAND_BLOCK
    - REPEATING_COMMAND_BLOCK
    - COMMAND_BLOCK_MINECART
    - STRUCTURE_BLOCK
    - STRUCTURE_VOID
    - JIGSAW
    - DEBUG_STICK
    - LIGHT
  # from 1-16
  max-offer-slots: 16
  max-history-records: 100
  rollback-max-age-hours: 0
  rollback-check-ender-chest: false
  send-webhook-on-trade: true
  # i dont recomend to change anything here but u can
  version-check:
    enabled: true
    github-repo: "plugglab/SafeTrade"
    download-url: "https://www.spigotmc.org/resources/safetradecore.135438/"


